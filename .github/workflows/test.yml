name: "Test Workflow for My Project"

on:
  push:
    branches: [main]

jobs:
  test_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        uses: actions/setup-python@v3
        with:
          python-version: "3.12"
      - name: "Install Dependencies"
        run: pip3 install -r requirements.txt
      - name: "Run Tests"
        run: pytest test/